<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <title>SEED - normalisation des mesures bancs</title>
  <style>
/* =====================================================================
   style.css — Thème Renault
   ---------------------------------------------------------------------
   Palette principale du brand book (R_RENAULT_BRAND_SHORTBOOK_v26.1) :
     yellow      Pantone 3955 C   #EFDF00
     white                        #FFFFFF
     gray light  Cool Gray 1 C    #D9D9D6
     gray mid    Cool Gray 4 C    #BBBCBC
     gray dark   Cool Gray 8 C    #888B8D
     black       Process Black C  #000000
   Typographie de marque : NouvelR (licence interne, repli système sinon).
   ===================================================================== */

:root{
  --rno-yellow:#EFDF00;
  --rno-yellow-dark:#D6C800;   /* survol : jaune assombri, hors palette stricte */
  --rno-white:#FFFFFF;
  --rno-gray-light:#D9D9D6;
  --rno-gray-mid:#BBBCBC;
  --rno-gray-dark:#888B8D;
  --rno-black:#000000;

  --bg:#F4F4F2;                /* fond général : gris light éclairci */
  --card:var(--rno-white);
  --accent:var(--rno-yellow);
  --txt:var(--rno-black);
  --muted:var(--rno-gray-dark);
  --line:var(--rno-gray-light);
  --field:#FAFAF9;

  --rayon:0;                   /* angles vifs : l'identité Renault est géométrique */
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:"NouvelR", "Segoe UI", Roboto, Arial, sans-serif;
  background:var(--bg);
  color:var(--txt);
  padding:24px;
}

main{ max-width:1400px; margin:0 auto; }
.workspaceGrid{ display:grid; grid-template-columns:minmax(280px, 1fr) minmax(0, 2fr); gap:18px; }
.workspaceGrid > .card{ min-width:0; }
.workspaceGrid button{ max-width:100%; }
#variablesCard{ display:flex; flex-direction:column; }
[hidden]{ display:none !important; }

h1{
  font-size:22px;
  margin:0 0 4px;
  font-weight:800;
  letter-spacing:.14em;
  text-transform:uppercase;
}
h1::before{
  content:"";
  display:block;
  width:44px;
  height:5px;
  background:var(--rno-yellow);
  margin-bottom:12px;
}
h2{
  font-size:13px;
  margin:0 0 14px;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase;
}

.entete h4{
  margin: 0 0 0 auto;
  align-self: flex-end;
}
.entete .aideLien{ align-self:flex-end; text-decoration:none; }
.sub{ color:var(--muted); font-size:13px; margin-bottom:20px; }
.hint{ font-size:12px; color:var(--muted); }

progress{ width:100%; height:6px; margin-top:16px; accent-color:var(--rno-yellow); }
#etat{ margin:12px 0 0; overflow-wrap:anywhere; }
.encodage{ width:auto; min-width:160px; }
.selectionLabel{ display:block; margin:18px 0 8px; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
.fileName{ margin:12px 0 0; overflow-wrap:anywhere; font-size:13px; font-weight:700; }

.measureToolbar{ display:flex; flex-wrap:nowrap; gap:10px; max-width:100%; overflow-x:auto; margin-top:14px; padding:14px 1px 8px; border-top:1px solid var(--line); }
.measureToolbar button{ flex:0 0 auto; width:auto; white-space:nowrap; }
.processingTools{ margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
.processingTools .selectionLabel{ margin:0; }
.syncActions{ margin-top:18px; justify-content:flex-end; }

/* ---- une "carte" = un bloc encadré, la brique de base de toute page ---- */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--rayon);
  padding:20px;
  margin-bottom:18px;
}

.row{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  align-items:center;
}

/* ---- boutons ----
   Jaune  = action (calcul, export, validation)
   Noir   = chargement de fichier
   Blanc  = action secondaire ou destructive                        ---- */
button, .filebtn{
  border:1px solid transparent;
  padding:10px 20px;
  border-radius:var(--rayon);
  font:inherit;
  font-size:13px;
  font-weight:700;
  letter-spacing:.04em;
  cursor:pointer;
  transition:background-color .15s ease, color .15s ease, border-color .15s ease;
}
button{
  background:var(--rno-yellow);
  color:var(--rno-black);
}
button:hover:not(:disabled){ background:var(--rno-yellow-dark); }
button:disabled{ background:var(--rno-gray-light); color:var(--rno-gray-dark); cursor:not-allowed; }

.btn2{
  background:var(--rno-white);
  color:var(--rno-black);
  border-color:var(--rno-black);
}
.btn2:hover:not(:disabled){ background:var(--rno-black); color:var(--rno-white); }
.btn2:disabled{ background:var(--rno-white); border-color:var(--rno-gray-light); }

.filebtn{
  display:inline-block;
  background:var(--rno-black);
  color:var(--rno-white);
}
.filebtn:hover{ background:var(--rno-gray-dark); }

:focus-visible{ outline:2px solid var(--rno-black); outline-offset:2px; }
input[type=file]{ display:none; }

/* ---- champs ---- */
select, input[type=number]{
  width:100%;
  background:var(--field);
  border:1px solid var(--rno-gray-mid);
  color:var(--txt);
  border-radius:var(--rayon);
  padding:8px 10px;
  font:inherit;
  font-size:14px;
}
select{ font-weight:600; }
select:focus, input[type=number]:focus{ border-color:var(--rno-black); outline:none; }

.clampTools select{ flex:1 1 220px; width:auto; min-width:0; }
.selectViewport{ display:flex; flex:1 1 auto; min-height:400px; max-width:100%; overflow:auto; margin-bottom:0; border:1px solid var(--line); }
#variables{ display:block; flex:1 1 auto; width:max-content; min-width:100%; max-width:none; height:100%; min-height:0; border:none; font-weight:400; direction:rtl; text-align:left; }
#variables option{ padding:4px 8px; white-space:nowrap; direction:ltr; text-align:left; }
#variables option:checked{ color:var(--rno-black); background:var(--rno-yellow); }

/* ---- boîte de dialogue ---- */
#syncDialog, #correctionManuelleDialog{
  width:min(520px, calc(100% - 24px));
  max-height:calc(100vh - 24px);
  overflow:auto;
  background:var(--card);
  color:var(--txt);
  border:1px solid var(--rno-black);
  border-top:5px solid var(--rno-yellow);
  border-radius:var(--rayon);
  padding:24px;
}
#syncDialog::backdrop, #correctionManuelleDialog::backdrop{ background:rgba(0,0,0,.45); }
#syncDialog label, #correctionManuelleDialog label{ display:block; margin:14px 0 6px; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
#syncDialog .hint, #correctionManuelleDialog .hint{ min-height:1em; }
[role=alert]{ color:#C8102E; font-weight:700; }

/* ---- tuiles ---- */
.pbox, .stat{
  background:var(--field);
  border:1px solid var(--line);
  border-radius:var(--rayon);
  padding:10px 14px;
}
.pbox{ min-width:170px; }
.stat{ min-width:140px; border-left:4px solid var(--rno-yellow); }
.pbox .lbl, .stat .lbl{
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.08em;
  margin-bottom:6px;
}
.stat .val{ font-size:19px; font-weight:800; }

/* ---- zone de graphique Plotly ---- */
.plot{
  width:100%;
  height:600px;
  background:var(--rno-white);
  border:1px solid var(--line);
  border-radius:var(--rayon);
  margin-top:10px;
}

code{ background:var(--field); border:1px solid var(--line); padding:2px 6px; color:var(--txt); }

/* ---- barres de chargement compactes ---- */
.ligneChargement{ gap:8px; }
.titreLigne{
  font-size:11px;
  font-weight:700;
  letter-spacing:.09em;
  text-transform:uppercase;
  color:var(--muted);
  white-space:nowrap;
}
.compact{ padding:6px 12px; font-size:12px; }
select.compact{ width:auto; min-width:140px; padding:6px 10px; font-size:12px; }

/* ---- sélection de plage temporelle ---- */
.plageTools{ margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
.plageTools label{ font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
.plageTools input[type=number]{ width:120px; }

/* ---- bouton icône (remise à zéro) ---- */
.btnIcone{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:32px;
  height:32px;
  padding:0;
  background:var(--rno-white);
  color:var(--rno-black);
  border-color:var(--rno-black);
  margin-left:auto;
}
.btnIcone:hover{ background:#C8102E; color:var(--rno-white); border-color:#C8102E; }
.btnIcone svg{ width:18px; height:18px; }

/* ---- bandeau de titre ---- */
.entete{ display:flex; align-items:center; gap:16px; margin-bottom:20px; }
.entete img{ height:52px; width:auto; }

@media(max-width:800px){
  .workspaceGrid{ grid-template-columns:minmax(0, 1fr); }
}
@media(max-width:640px){
  body{ padding:12px; }
  .card{ padding:14px; }
  button, .filebtn{ width:100%; text-align:center; }
  .plot{ height:460px; }
}

  <script>
const $ = id => document.getElementById(id);

// Correspondances reprises de data_labelling.xlsx, onglet LABEL (« NC » = voie absente du banc).
const CORRESPONDANCES_VOIES = [
  { seed: "TEMPS", bperf: "Timer for free recording", brbc3: "TEMPS", soufflerie: "Temps" },
  { seed: "VITESSE_BANC", bperf: "UDP Speed", brbc3: "VIT_AV", soufflerie: "VITESSE_AV" },
  { seed: "ACCEL_BANC", bperf: "Accél_banc_A", brbc3: "ACCEL_AV", soufflerie: "ACCEL_AV" },
  { seed: "EFFORT_VEH_TOTAL", bperf: "UDP Force véh_A", brbc3: "NC", soufflerie: "F_FILT_JANTE_GLOBAL" },
  { seed: "EFFORT_VEH_AV", bperf: "UDP Force véh AV_A", brbc3: "FORCE_VH_AV", soufflerie: "F_FILT_JANTE_AV" },
  { seed: "EFFORT_VEH_AR", bperf: "UDP Force véh AR_A", brbc3: "FORCE_VH_AR", soufflerie: "F_FILT_JANTE_AR" },
  { seed: "DISTANCE_BANC_AV", bperf: "Compteur distance essieu AV", brbc3: "DISTAV", soufflerie: "DISTANCE_AV" },
  { seed: "MASSE_ESSAI_BANC", bperf: "Inertie Banc", brbc3: "INERTIE [kg]", soufflerie: "SIM_INERTIE" },
  { seed: "COEFF_F0_BANC", bperf: "F1", brbc3: "F0  [N]", soufflerie: "COEFF_A" },
  { seed: "COEFF_F1_BANC", bperf: "F2", brbc3: "F1  [N/(km/h)]", soufflerie: "COEFF_B" },
  { seed: "COEFF_F2_BANC", bperf: "F3", brbc3: "F2  [N/(km/h)²]", soufflerie: "COEFF_C" },
  { seed: "VITESSE_CYCLE", bperf: "Vitesse cycle theorique", brbc3: "ScheduledSpeed", soufflerie: "CONS_VITESSE" },
  { seed: "PENTE_CYCLE", bperf: "Pente cycle theorique", brbc3: "PENTE", soufflerie: "PENTE_PC" },
  { seed: "RAPPORT_BV_CYCLE", bperf: "NC", brbc3: "RAPPORT_THEO", soufflerie: "NC" },
  { seed: "PHASE_ESSAI", bperf: "Rapport cycle theorique", brbc3: "PHASE", soufflerie: "NC" },
  { seed: "TEMPERATURE_BANC", bperf: "Température ambiante", brbc3: "CellTemperature", soufflerie: "TEMP_SF" },
  { seed: "HYGROMETRIE_BANC", bperf: "Hygrométrie", brbc3: "RelativeHumidity", soufflerie: "HR_SF" },
  { seed: "PRESSION_ATMO_BANC", bperf: "Pression atmosphérique", brbc3: "Barometer", soufflerie: "P_PLENUM_ABS" },
  { seed: "VITESSE_VENT_BANC", bperf: "Vitesse ventilation aile", brbc3: "ClimaticCoolingFanActualSpeed", soufflerie: "VITESSE_VENT" },
  { seed: "ENSOLEILLEMENT", bperf: "NC", brbc3: "Consigne solaire", soufflerie: "SOL_SF" }
];

const BANCS = {
  bperf: { libelle: "BPERF", accept: ".M001,.M002,.M003,.M004,.M005,.M006,.M007,.M008,.M009,.m001,.m002,.m003,.m004,.m005,.m006,.m007,.m008,.m009", correction: true },
  brbc3: { libelle: "BRBC3", accept: ".csv,.txt", correction: true },
  soufflerie: { libelle: "Soufflerie", accept: ".csv,.txt", correction: true },
  seed: { libelle: "SEED", accept: ".seed", correction: false }
};

// Les fichiers d'un même banc écrivent indifféremment les voies avec espaces ou soulignés.
function tableRenommage(banc){
  const table = new Map();
  for(const ligne of CORRESPONDANCES_VOIES){
    const source = (ligne[banc] || "").trim();
    if(!source || source === "NC") continue;
    table.set(source, ligne.seed);
    table.set(source.replace(/\s+/g, "_"), ligne.seed);
  }
  return table;
}

let mesures = [];
let dates = [];
let chargement = 0;
let bancCourant = "bperf";
let donneesOffset = null;
let correctionAppliquee = false;
let sourceExterne = null;
let donneesAvantSync = null;

function dateMesure(jour, heure){
  const match = /^(\d{2})([/-])(\d{2})\2(\d{2}|\d{4})$/.exec(jour);
  if(!match || !/^\d{2}:\d{2}:\d{2}(?:\.\d+)?$/.test(heure)) return null;
  const annee = match[4].length === 4 ? match[4] : Number(match[4]) < 70 ? `20${match[4]}` : `19${match[4]}`;
  const iso = `${annee}-${match[3]}-${match[1]}T${heure}`;
  return Number.isNaN(new Date(iso).getTime()) ? null : iso;
}

function dateDepuisInstant(instant){
  const date = new Date(instant);
  const deuxChiffres = valeur => String(valeur).padStart(2, "0");
  const troisChiffres = valeur => String(valeur).padStart(3, "0");
  return `${date.getFullYear()}-${deuxChiffres(date.getMonth() + 1)}-${deuxChiffres(date.getDate())}T${deuxChiffres(date.getHours())}:${deuxChiffres(date.getMinutes())}:${deuxChiffres(date.getSeconds())}.${troisChiffres(date.getMilliseconds())}`;
}

function preparerColonnes(entetes, unites, table, debut){
  return entetes.map((nom, index) => {
    const nomSource = nom.trim();
    const nomAffiche = table.get(nomSource) || nomSource;
    return {
      index,
      nom: nomSource,
      nomAffiche,
      label: `${nomAffiche || `Colonne ${index + 1}`} (${index + 1})`,
      unite: (unites[index] || "").trim(),
      valeurs: [],
      valides: 0
    };
  }).slice(debut);
}

async function analyserFichier(fichier, progression = () => {}){
  if(!/\.M00\d$/i.test(fichier.name)) throw new Error("Choisir un fichier .M00x.");
  const table = tableRenommage("bperf");
  let numeroLigne = 0;
  let entetes;
  let indiceTimer = -1;
  let instantInitial = null;
  let timerInitial = null;
  let premiereLigneMesure = true;
  let lignesIgnorees = 0;
  const colonnes = [];
  const temps = [];

  await lireFichier(fichier, $("encodage").value, progression, ligne => {
    numeroLigne++;
    if(numeroLigne === 1){
      if(!ligne.startsWith("MNTPFILE ")) throw new Error("En-tête MNTPFILE absent.");
      return;
    }
    if(numeroLigne === 2) return;
    if(numeroLigne === 3){
      entetes = ligne.split("\t");
      if(entetes[0] !== "Date" || entetes[1] !== "Heure") throw new Error("Colonnes Date/Heure absentes.");
      indiceTimer = entetes.findIndex(nom => nom.trim() === "Timer for free recording");
      if(indiceTimer < 0) throw new Error("Voie Timer for free recording absente.");
      return;
    }
    if(numeroLigne === 4){
      const unites = ligne.split("\t");
      if(unites.length !== entetes.length) throw new Error("La ligne d'unités ne correspond pas à l'en-tête.");
      colonnes.push(...preparerColonnes(entetes, unites, table, 2));
      return;
    }
    if(!ligne.trim()) return;
    const champs = ligne.split("\t");
    if(champs.length !== entetes.length){
      lignesIgnorees++;
      return;
    }
    const texteTimer = champs[indiceTimer].trim();
    const timer = texteTimer && /^[+-]?(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?$/.test(texteTimer) ? Number(texteTimer) : null;
    if(timer === null || !Number.isFinite(timer)){
      lignesIgnorees++;
      return;
    }
    if(premiereLigneMesure){
      const dateInitiale = dateMesure(champs[0], champs[1]);
      if(!dateInitiale) throw new Error("Date/Heure de la première mesure invalide.");
      instantInitial = Date.parse(dateInitiale);
      timerInitial = timer;
      premiereLigneMesure = false;
    }
    temps.push(dateDepuisInstant(instantInitial + (timer - timerInitial) * 1000));
    for(const colonne of colonnes){
      const brut = champs[colonne.index].trim();
      const valeur = brut && /^[+-]?(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?$/.test(brut) ? Number(brut) : null;
      colonne.valeurs.push(Number.isFinite(valeur) ? valeur : null);
      if(valeur !== null && Number.isFinite(valeur)) colonne.valides++;
    }
  });

  if(numeroLigne < 5 || !temps.length) throw new Error("Aucune mesure valide dans ce fichier.");
  return { dates: temps, mesures: colonnes.filter(colonne => colonne.valides > 0), lignesIgnorees };
}

function nettoyerNomBanc(nom, banc){
  const nettoye = (nom || "").replace(/[\r\n]/g, "").trim();
  return banc === "brbc3" ? nettoye.replace(/[\s~]+/g, "_") : nettoye;
}

// BRBC3 et Soufflerie froide fournissent une colonne TEMPS : la base de temps est reconstruite au pas constant.
function baseTempsReguliere(temps, instantInitial){
  const pas = temps.length > 2 ? temps[2] - temps[1] : temps[1] - temps[0];
  if(!(pas > 0)) throw new Error("Pas de temps nul ou décroissant dans la colonne TEMPS.");
  return { pas, dates: temps.map((ignore, index) => dateDepuisInstant(instantInitial + index * pas * 1000)) };
}

// Le compteur de distance du BRBC3 n'est pas exploitable : il est réintégré depuis la vitesse.
function recalculerDistanceBrbc3(colonnes, pas){
  const vitesse = colonnes.find(colonne => colonne.nomAffiche === "VITESSE_BANC");
  const distance = colonnes.find(colonne => colonne.nomAffiche === "DISTANCE_BANC_AV");
  if(!vitesse || !distance) return;
  let cumul = 0;
  distance.valeurs = vitesse.valeurs.map(valeur => {
    cumul += (valeur ?? 0) / 3.6 * pas;
    return cumul;
  });
  distance.valides = distance.valeurs.length;
  distance.unite = "m";
}

function instantBrbc3(brut){
  const horodatage = /^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}:\d{2}:\d{2}(?:[.,]\d+)?)$/.exec((brut || "").trim());
  if(!horodatage) return null;
  const iso = `${horodatage[3]}-${horodatage[2]}-${horodatage[1]}T${horodatage[4].replace(",", ".")}`;
  return Number.isNaN(new Date(iso).getTime()) ? null : Date.parse(iso);
}

async function analyserFichierBrbc3(fichier, progression = () => {}){
  const table = tableRenommage("brbc3");
  let numeroLigne = 0;
  let ligneVoies = 0;
  let ligneValeursConstantes = 0;
  let nomsConstantes = null;
  let valeursConstantes = null;
  let entetes = null;
  let unites = [];
  let colonnes = [];
  let indiceHorodatage = -1;
  let instantInitial = null;
  let lignesIgnorees = 0;
  const temps = [];

  await lireFichier(fichier, "utf-8", progression, ligne => {
    numeroLigne++;
    const champs = champsCsv(ligne.replace(/^\uFEFF/, ""), ",");
    if(!entetes){
      if(numeroLigne > 30) throw new Error("Ligne de voies « TEMPS » introuvable dans les 30 premières lignes.");
      if(champs[0].trim() === "NUMERO_ESSAI"){
        nomsConstantes = champs;
        ligneValeursConstantes = numeroLigne + 2;
      }else if(numeroLigne === ligneValeursConstantes) valeursConstantes = champs;
      else if(champs[0].trim() === "TEMPS"){
        entetes = champs;
        ligneVoies = numeroLigne;
        indiceHorodatage = champs.findIndex(nom => nom.trim() === "Time");
      }
      return;
    }
    if(numeroLigne === ligneVoies + 1){
      unites = champs;
      colonnes = preparerColonnes(entetes, unites, table, 1).map(colonne => ({
        ...colonne,
        nom: nettoyerNomBanc(colonne.nom, "brbc3"),
        nomAffiche: nettoyerNomBanc(colonne.nomAffiche, "brbc3")
      }));
      for(const colonne of colonnes) colonne.label = `${colonne.nomAffiche} (${colonne.index + 1})`;
      return;
    }
    if(!ligne.trim()) return;
    const instant = nombreSource(champs[0], false);
    if(instant === null){
      lignesIgnorees++;
      return;
    }
    if(instantInitial === null && indiceHorodatage >= 0) instantInitial = instantBrbc3(champs[indiceHorodatage]);
    temps.push(instant);
    for(const colonne of colonnes){
      const valeur = nombreSource(champs[colonne.index], false);
      colonne.valeurs.push(valeur);
      if(valeur !== null) colonne.valides++;
    }
  });

  if(temps.length < 2) throw new Error("Aucune mesure valide dans ce fichier BRBC3.");
  const { pas, dates: horodatages } = baseTempsReguliere(temps, instantInitial ?? fichier.lastModified);
  const retenues = colonnes.filter(colonne => colonne.valides > 0);

  // L'inertie et les coefficients de route ne figurent que dans l'entête du fichier.
  if(nomsConstantes && valeursConstantes){
    let prochainIndex = Math.max(0, ...retenues.map(colonne => colonne.index)) + 1;
    for(let index = 0; index < nomsConstantes.length; index++){
      const nomAffiche = table.get(nomsConstantes[index].trim());
      const valeur = nombreSource(valeursConstantes[index], false);
      if(!nomAffiche || valeur === null) continue;
      retenues.push({
        index: prochainIndex,
        nom: nettoyerNomBanc(nomsConstantes[index], "brbc3"),
        nomAffiche,
        label: `${nomAffiche} (${prochainIndex + 1})`,
        unite: "",
        valeurs: new Array(temps.length).fill(valeur),
        valides: temps.length
      });
      prochainIndex++;
    }
  }
  recalculerDistanceBrbc3(retenues, pas);
  return { dates: horodatages, mesures: retenues, lignesIgnorees, pas };
}

// Fichier déjà normalisé : voies au nom SEED, valeurs corrigées, colonne TEMPS en secondes.
async function analyserFichierSeed(fichier, progression = () => {}){
  let numeroLigne = 0;

  await lireFichier(fichier, "windows-1252", progression, ligne => {
    numeroLigne++;

    if(numeroLigne === 1){
      if(champs[0].trim() !== "TEMPS") throw new Error("Colonne TEMPS absente : ce fichier n'est pas un export SEED.");
      colonnes = preparerColonnes(champs, [], new Map(), 1);
      return;
    }
    if(!ligne.trim()) return;
    const instant = nombreSource(champs[0], false);
    if(instant === null){
      lignesIgnorees++;

    for(const colonne of colonnes){
      const valeur = nombreSource(champs[colonne.index], false);

    }

}

  const table = tableRenommage("soufflerie");

  await lireFichier(fichier, "windows-1252", progression, ligne => {

    if(numeroLigne === 1){
      colonnes = preparerColonnes(champs, [], table, 1).map(colonne => ({

    for(const colonne of colonnes){

async function lireFichier(fichier, encodage, progression, ligneLue){
  const lecteur = fichier.stream().getReader();
  const decodeur = new TextDecoder(encodage);
  let reste = "";
  let octets = 0;
  try{
    while(true){
      const { value, done } = await lecteur.read();
      if(done) break;
      octets += value.byteLength;
      reste += decodeur.decode(value, { stream: true });
      let fin;
      while((fin = reste.indexOf("\n")) !== -1){
        ligneLue(reste.slice(0, fin).replace(/\r$/, ""));
        reste = reste.slice(fin + 1);
      }
      progression(octets / fichier.size);
    }
    reste += decodeur.decode();
    if(reste.trim()) ligneLue(reste.replace(/\r$/, ""));
    progression(1);
  }finally{
    lecteur.releaseLock();
  }
}

function champsCsv(ligne, separateur){
  const champs = [];
  let champ = "";
  let guillemets = false;
  for(let index = 0; index < ligne.length; index++){
    const caractere = ligne[index];
    if(caractere === '"'){
      if(guillemets && ligne[index + 1] === '"'){
        champ += '"';
        index++;
      }else guillemets = !guillemets;
    }else if(caractere === separateur && !guillemets){
      champs.push(champ.trim());
      champ = "";
    }else champ += caractere;
  }
  champs.push(champ.trim());
  return champs;
}

async function analyserCsv(fichier){
  if(!/\.csv$/i.test(fichier.name)) throw new Error("Choisir un fichier CSV.");
  let entetes = null;
  let separateur = ",";
  let mesuresCsv = [];
  let nombreLignes = 0;
  const temps = [];
  await lireFichier(fichier, "utf-8", () => {}, ligne => {
    if(!ligne.trim()) return;
    if(!entetes){
      separateur = (ligne.match(/;/g) || []).length > (ligne.match(/,/g) || []).length ? ";" : ",";
      entetes = champsCsv(ligne.replace(/^\uFEFF/, ""), separateur);
      if(entetes.length < 2) throw new Error("Le CSV doit contenir des voies de mesure.");
      mesuresCsv = entetes.slice(1).map((nom, index) => ({
        nom: nom || `Colonne ${index + 2}`,
        valeurs: [],
        valides: 0
      }));
      return;
    }
    const champs = champsCsv(ligne, separateur);
    if(champs.length !== entetes.length) throw new Error(`Ligne CSV ${nombreLignes + 2} : nombre de colonnes incorrect.`);
    nombreLignes++;
    const secondes = nombreSource(champs[0], separateur === ";");
    const horaire = secondes === null ? instantSource(champs[0], "horaire", false) : secondes;
    const instant = horaire === null ? Date.parse(champs[0]) / 1000 : horaire;
    temps.push(Number.isFinite(instant) ? instant : null);
    for(let index = 0; index < mesuresCsv.length; index++){
      const brut = champs[index + 1];
      const valeur = brut && /^[+-]?(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?$/.test(brut) ? Number(brut) : null;
      mesuresCsv[index].valeurs.push(valeur);
      if(valeur !== null && Number.isFinite(valeur)) mesuresCsv[index].valides++;
    }
  });
  if(!nombreLignes) throw new Error("Le CSV ne contient aucune mesure.");
  return { nom: fichier.name, libelle: "CAN", temps, mesures: mesuresCsv.filter(colonne => colonne.valides), longueur: nombreLignes };
}

// Formats issus des outils SEED : CarScanner, OBD Facile et Diagra.
const CONFIG_SOURCES = {
  carscanner: { libelle: "CarScanner", encodage: "utf-8", separateur: ",", enTete: 1, ligneNoms: 1, ligneUnites: 0, virguleDecimale: false, temps: "horaire" },
  obd: { libelle: "OBD Facile", encodage: "windows-1252", separateur: ";", enTete: 3, ligneNoms: 1, ligneUnites: 3, virguleDecimale: true, temps: "secondes" },
  diagra: { libelle: "Diagra", encodage: "utf-8", separateur: ";", enTete: 3, ligneNoms: 2, ligneUnites: 3, virguleDecimale: false, temps: "millisecondes" }
};

function nombreSource(brut, virguleDecimale){
  let texte = (brut ?? "").trim();
  if(!texte) return null;
  if(virguleDecimale) texte = texte.replace(/\./g, "").replace(",", ".");
  const valeur = /^[+-]?(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?$/.test(texte) ? Number(texte) : null;
  return Number.isFinite(valeur) ? valeur : null;
}

function instantSource(brut, format, virguleDecimale){
  if(format !== "horaire") {
    const valeur = nombreSource(brut, virguleDecimale);
    return valeur === null ? null : format === "millisecondes" ? valeur / 1000 : valeur;
  }
  const horodatage = /^(\d{1,2}):(\d{2}):(\d{2})(?:[.,](\d+))?$/.exec((brut ?? "").trim());
  if(!horodatage) return null;
  return Number(horodatage[1]) * 3600 + Number(horodatage[2]) * 60 + Number(horodatage[3])
    + (horodatage[4] ? Number(`0.${horodatage[4]}`) : 0);
}

function pasMedian(temps){
  const ecarts = [];
  for(let index = 1; index < temps.length; index++){
    const ecart = temps[index] - temps[index - 1];
    if(ecart > 0) ecarts.push(ecart);
  }
  if(!ecarts.length) return 0;
  ecarts.sort((a, b) => a - b);
  return ecarts[Math.floor(ecarts.length / 2)];
}

function interpolerLineaire(temps, valeurs, grille){
  const sortie = new Array(grille.length).fill(null);
  const dernier = temps.length - 1;
  let curseur = 0;
  for(let index = 0; index < grille.length; index++){
    const instant = grille[index];
    if(instant < temps[0] || instant > temps[dernier]) continue;
    while(curseur < dernier - 1 && temps[curseur + 1] < instant) curseur++;
    const avant = valeurs[curseur];
    const apres = valeurs[curseur + 1];
    if(avant === null || apres === null) continue;
    const duree = temps[curseur + 1] - temps[curseur];
    sortie[index] = duree > 0 ? avant + (apres - avant) * (instant - temps[curseur]) / duree : avant;
  }
  return sortie;
}

async function analyserSourceTemporelle(fichier, type, pasCible){
  const config = CONFIG_SOURCES[type];
  let numeroLigne = 0;
  let noms = [];
  let unites = [];
  let colonnes = [];
  let precedent = null;
  let decalageJour = 0;
  const temps = [];

  await lireFichier(fichier, config.encodage, () => {}, ligne => {
    numeroLigne++;
    if(numeroLigne <= config.enTete){
      const champs = champsCsv(ligne.replace(/^\uFEFF/, ""), config.separateur);
      if(numeroLigne === config.ligneNoms) noms = champs;
      if(numeroLigne === config.ligneUnites) unites = champs;
      return;
    }
    if(!ligne.trim()) return;
    const champs = champsCsv(ligne, config.separateur);
    let instant = instantSource(champs[0], config.temps, config.virguleDecimale);
    if(instant === null) return;
    if(config.temps === "horaire"){
      if(precedent !== null && instant + decalageJour < precedent - 1) decalageJour += 86400;
      precedent = instant + decalageJour;
      instant = precedent;
    }
    if(!colonnes.length){
      const nombreVoies = Math.max(noms.length, champs.length) - 1;
      colonnes = Array.from({ length: nombreVoies }, (ignore, index) => ({
        nom: (noms[index + 1] || `Colonne ${index + 2}`).trim() || `Colonne ${index + 2}`,
        unite: (unites[index + 1] || "").trim(),
        valeurs: [],
        valides: 0
      }));
    }
    temps.push(instant);
    for(let index = 0; index < colonnes.length; index++){
      const valeur = nombreSource(champs[index + 1], config.virguleDecimale);
      colonnes[index].valeurs.push(valeur);
      if(valeur !== null) colonnes[index].valides++;
    }
  });

  if(temps.length < 2) throw new Error(`Le fichier ${config.libelle} ne contient pas assez de mesures.`);
  const origine = temps[0];
  const tempsRelatif = temps.map(instant => instant - origine);
  const pasSource = pasMedian(tempsRelatif);
  if(!pasSource) throw new Error(`Pas de temps indéterminable dans le fichier ${config.libelle}.`);

  const reechantillonne = Math.abs(pasSource - pasCible) > pasCible * 1e-3;
  let mesures = colonnes.filter(colonne => colonne.valides);
  let longueur = tempsRelatif.length;
  if(reechantillonne){
    const duree = tempsRelatif[tempsRelatif.length - 1];
    const grille = Array.from({ length: Math.floor(duree / pasCible) + 1 }, (ignore, index) => index * pasCible);
    mesures = mesures.map(colonne => {
      const valeurs = interpolerLineaire(tempsRelatif, colonne.valeurs, grille);
      return { ...colonne, valeurs, valides: valeurs.filter(valeur => valeur !== null).length };
    });
    longueur = grille.length;
  }
  if(!mesures.length) throw new Error(`Aucune voie numérique exploitable dans le fichier ${config.libelle}.`);
  return { nom: fichier.name, libelle: config.libelle, mesures, longueur, pasSource, pasCible, reechantillonne };
}

function premierFranchissement(valeurs, seuil){
  for(let index = 1; index < valeurs.length; index++){
    if(valeurs[index - 1] !== null && valeurs[index] !== null && valeurs[index - 1] < seuil && valeurs[index] >= seuil) return index;
  }
  return -1;
}

function plageSynchronisee(longueurMesure, longueurCsv, repereMesure, repereCsv){
  const debutMesure = Math.max(0, repereMesure - repereCsv);
  const debutCsv = Math.max(0, repereCsv - repereMesure);
  const longueur = Math.min(longueurMesure - debutMesure, longueurCsv - debutCsv);
  return { debutMesure, debutCsv, longueur };
}

const PRECISION_EXPORT = 5;

function pasTemps(instants){
  if(instants.length < 2) return 1;
  const ecarts = [];
  for(let index = 1; index < Math.min(instants.length, 101); index++){
    const ecart = (Date.parse(instants[index]) - Date.parse(instants[index - 1])) / 1000;
    if(Number.isFinite(ecart) && ecart > 0) ecarts.push(ecart);
  }
  if(!ecarts.length) return 1;
  ecarts.sort((a, b) => a - b);
  return ecarts[Math.floor(ecarts.length / 2)];
}

function nomVoieSeed(colonne){
  return (colonne.nomAffiche || colonne.nom || `vide_${colonne.index + 1}`).trim().replace(/\s+/g, "_");
}

// Les fichiers .seed sont lus en windows-1252 : les accents doivent rester sur un seul octet.
const CP1252_SPECIFIQUES = new Map([
  [0x20AC, 0x80], [0x201A, 0x82], [0x0192, 0x83], [0x201E, 0x84], [0x2026, 0x85],
  [0x2020, 0x86], [0x2021, 0x87], [0x02C6, 0x88], [0x2030, 0x89], [0x0160, 0x8A],
  [0x2039, 0x8B], [0x0152, 0x8C], [0x017D, 0x8E], [0x2018, 0x91], [0x2019, 0x92],
  [0x201C, 0x93], [0x201D, 0x94], [0x2022, 0x95], [0x2013, 0x96], [0x2014, 0x97],
  [0x02DC, 0x98], [0x2122, 0x99], [0x0161, 0x9A], [0x203A, 0x9B], [0x0153, 0x9C],
  [0x017E, 0x9E], [0x0178, 0x9F]
]);

function encoderCp1252(texte){
  const octets = new Uint8Array(texte.length);
  for(let index = 0; index < texte.length; index++){
    const code = texte.charCodeAt(index);
    octets[index] = code <= 0xFF ? code : (CP1252_SPECIFIQUES.get(code) ?? 0x3F);
  }
  return octets;
}

// Arrondi à 5 décimales puis zéros inutiles retirés : même précision, fichier bien plus léger.
function formaterValeurSeed(valeur){
  if(!Number.isFinite(valeur)) return "";
  const texte = valeur.toFixed(PRECISION_EXPORT).replace(/(\.\d*?)0+$/, "$1").replace(/\.$/, "");
  return texte === "-0" ? "0" : texte;
}

function contenuExportSeed(colonnes, instants, debut = 0, fin = instants.length - 1){
  const pas = pasTemps(instants);
  const lignes = [["TEMPS", ...colonnes.map(nomVoieSeed)].join("\t")];
  for(let index = debut; index <= fin; index++){
    const champs = [formaterValeurSeed((index - debut) * pas)];
    for(const colonne of colonnes) champs.push(formaterValeurSeed(colonne.valeurs[index]));
    lignes.push(champs.join("\t"));
  }
  return lignes.join("\n") + "\n";
}

function synchroniserSources(){
  const source = donneesAvantSync || { dates, mesures };
  const voieMesure = source.mesures.find(colonne => colonne.index === Number($("voieMesure").value));
  const voieCsv = sourceExterne?.mesures[Number($("voieCsv").value)];
  const seuil = $("seuilSync").valueAsNumber;
  if(!voieMesure || !voieCsv || !Number.isFinite(seuil)) throw new Error("Choisir deux voies et un seuil valide.");
  const repereMesure = premierFranchissement(voieMesure.valeurs, seuil);
  const repereCsv = premierFranchissement(voieCsv.valeurs, seuil);
  if(repereMesure < 0) throw new Error(`Aucun franchissement vers le haut de ${seuil} sur la voie ${BANCS[bancCourant].libelle} « ${voieMesure.label} ».`);
  if(repereCsv < 0) throw new Error(`Aucun franchissement vers le haut de ${seuil} sur la voie ${sourceExterne.libelle} « ${voieCsv.nom} ».`);
  const { debutMesure, debutCsv, longueur } = plageSynchronisee(source.dates.length, sourceExterne.longueur, repereMesure, repereCsv);
  if(!longueur) throw new Error("Aucune plage commune après synchronisation.");

  if(!donneesAvantSync){
    donneesAvantSync = {
      dates: dates.slice(),
      mesures: mesures.map(colonne => ({ ...colonne, valeurs: colonne.valeurs.slice(), valeursInitiales: colonne.valeursInitiales?.slice() }))
    };
  }
  const selection = new Set(Array.from($("variables").selectedOptions, option => Number(option.value)));
  dates = source.dates.slice(debutMesure, debutMesure + longueur);
  mesures = source.mesures.map(colonne => ({
    ...colonne,
    valeurs: colonne.valeurs.slice(debutMesure, debutMesure + longueur),
    ...(colonne.valeursInitiales ? { valeursInitiales: colonne.valeursInitiales.slice(debutMesure, debutMesure + longueur) } : {})
  }));
  const premierIndex = Math.max(0, ...mesures.map(colonne => colonne.index)) + 1;
  mesures.push(...sourceExterne.mesures.map((colonne, index) => {
    const label = `${sourceExterne.libelle} : ${colonne.nom}`;
    const unite = colonne.unite || (index === Number($("voieCsv").value) ? voieMesure.unite : "");
    const valeurs = colonne.valeurs.slice(debutCsv, debutCsv + longueur);
    return {
      index: premierIndex + index,
      nom: colonne.nom,
      nomAffiche: colonne.nom,
      externe: true,
      label,
      labelInitial: label,
      unite,
      uniteInitiale: unite,
      valeurs,
      valeursInitiales: valeurs.slice(),
      valides: colonne.valides
    };
  }));
  remplirVariables(selection, false);
  remplirFamillesPinces();
  if(selection.size) tracer();
  $("etatSync").textContent = `${sourceExterne.nom} synchronisé : ${longueur.toLocaleString("fr-FR")} échantillons communs, repères ${BANCS[bancCourant].libelle} n°${repereMesure + 1} et ${sourceExterne.libelle} n°${repereCsv + 1}.`;
  $("syncDialog").close();
}

function calculerOffsets(donnees){
  const dernierInstant = donnees.temps ? donnees.temps[donnees.temps.length - 1] * 1000 : Date.parse(donnees.dates[donnees.dates.length - 1]);
  if(donnees.temps && (donnees.temps[donnees.temps.length - 1] === null || !Number.isFinite(dernierInstant))) throw new Error("Le CSV d'offset doit contenir un temps valide dans sa première colonne (secondes ou horodatage).");
  const debutFenetre = dernierInstant - 60000;
  const offsets = new Map();
  for(const colonne of donnees.mesures){
    if(colonne.nom.length <= 2 || colonne.nom[1] !== "_") continue;
    const valeurs = colonne.valeurs.filter((valeur, index) => {
      if(donnees.temps && donnees.temps[index] === null) return false;
      const instant = donnees.temps ? donnees.temps[index] * 1000 : Date.parse(donnees.dates[index]);
      return Number.isFinite(valeur) && instant >= debutFenetre && instant <= dernierInstant;
    });
    if(valeurs.length) offsets.set(colonne.nom, valeurs.reduce((somme, valeur) => somme + valeur, 0) / valeurs.length);
  }
  return offsets;
}

// Convention d'instrumentation commune aux bancs : TYPE_<voie>_<coefficient>.
const SUFFIXES_ECHELLE = { I: "A", U: "V", T: "°C", P: "bar", D: "mm" };

function echelleVoie(nom){
  const morceaux = nom.split("_");
  const type = morceaux[0];
  const texteCoeff = morceaux[morceaux.length - 1];
  const coeff = Number(texteCoeff);
  if(morceaux.length < 2 || !Object.hasOwn(SUFFIXES_ECHELLE, type)) return null;
  if(!/^[+-]?(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?$/.test(texteCoeff) || !Number.isFinite(coeff)) return null;
  return { type, coeff, unite: SUFFIXES_ECHELLE[type] };
}

function appliquerEchelleSource(donneesOffsetSource = null){
  if(!sourceExterne || sourceExterne.echelleAppliquee) return;
  if(sourceExterne.libelle === "CAN" && !donneesOffsetSource) return;
  const offsets = donneesOffsetSource ? calculerOffsets(donneesOffsetSource) : new Map();
  let voiesMisesEchelle = 0;
  let offsetsAppliques = 0;
  let offsetsManquants = 0;
  const misesEchelle = new Map();

  for(const colonne of sourceExterne.mesures){
    const echelle = echelleVoie(colonne.nom);
    if(!echelle) continue;
    const offset = echelle.type !== "T" ? offsets.get(colonne.nom) ?? 0 : 0;
    if(donneesOffsetSource && echelle.type !== "T"){
      if(offsets.has(colonne.nom)) offsetsAppliques++;
      else offsetsManquants++;
    }
    colonne.valeurs = colonne.valeurs.map(valeur => valeur === null ? null : (valeur - offset) * echelle.coeff / 10);
    colonne.unite = echelle.unite;
    colonne.coeff = echelle.coeff;
    misesEchelle.set(colonne.nom, { ...echelle, offset });
    voiesMisesEchelle++;
  }

  // Les voies déjà fusionnées par une synchronisation antérieure doivent suivre.
  for(const colonne of mesures){
    const echelle = colonne.externe ? misesEchelle.get(colonne.nom) : null;
    if(!echelle) continue;
    const signe = colonne.signe || 1;
    colonne.valeurs = colonne.valeursInitiales.map(valeur => valeur === null ? null : (valeur - echelle.offset) * echelle.coeff / 10 * signe);
    colonne.valeursInitiales = colonne.valeurs.map(valeur => valeur === null ? null : valeur * signe);
    colonne.unite = echelle.unite;
    colonne.uniteInitiale = echelle.unite;
    colonne.coeff = echelle.coeff;
  }

  sourceExterne.echelleAppliquee = true;
  $("appliquerEchelleSource").disabled = true;
  remplirVariables(new Set(Array.from($("variables").selectedOptions, option => Number(option.value))));
  remplirFamillesPinces();
  if($("variables").selectedOptions.length) tracer();
  $("etatSync").textContent = voiesMisesEchelle
    ? `${voiesMisesEchelle} voie(s) de ${sourceExterne.libelle} mises à l'échelle depuis leur coefficient.${donneesOffsetSource ? ` ${offsetsAppliques} offsets appliqués sur la dernière minute${offsetsManquants ? ` ; ${offsetsManquants} voie(s) sans correspondance d'offset (offset nul)` : ""}.` : ""}`
    : `Aucune voie de ${sourceExterne.libelle} ne suit la convention TYPE_…_coefficient.`;
}

function appliquerCorrection(){
  if(!donneesOffset || !mesures.length || correctionAppliquee) return;
  const offsets = calculerOffsets(donneesOffset);
  let voiesCorrigees = 0;
  let offsetsAppliques = 0;
  let offsetsManquants = 0;

  mesures = mesures.filter(colonne => !colonne.derivee);
  for(const colonne of mesures){
    if(colonne.externe) continue;
    const echelle = echelleVoie(colonne.nom);
    if(!echelle) continue;
    const { type, coeff } = echelle;

    colonne.coeff = coeff;
    const offset = offsets.get(colonne.nom) ?? 0;
    const offsetEligible = type !== "T";
    if(offsetEligible){
      if(offsets.has(colonne.nom)) offsetsAppliques++;
      else offsetsManquants++;
    }
    const signe = colonne.signe || 1;
    colonne.valeurs = colonne.valeursInitiales.map(valeur => valeur === null ? null : (valeur - (offsetEligible ? offset : 0)) * coeff / 10 * signe);
    colonne.unite = echelle.unite;
    colonne.label = `${colonne.nomAffiche}${echelle.unite} (${colonne.index + 1})`;
    voiesCorrigees++;
  }

  const selection = new Set(Array.from($("variables").selectedOptions, option => Number(option.value)));
  remplirVariables(selection);
  if(selection.size) tracer();
  correctionAppliquee = voiesCorrigees > 0;
  $("appliquerCorrection").disabled = correctionAppliquee;
  remplirFamillesPinces();
  $("reinitialiserCorrection").hidden = false;
  $("etatCorrection").textContent = `${voiesCorrigees} voies mises à l'échelle ; ${offsetsAppliques} offsets appliqués sur la dernière minute${offsetsManquants ? ` ; ${offsetsManquants} voie(s) sans correspondance d'offset (offset nul)` : ""}.`;
}

function reinitialiserCorrection(){
  mesures = mesures.filter(colonne => !colonne.derivee);
  for(const colonne of mesures){
    const signe = colonne.signe || 1;
    colonne.valeurs = colonne.valeursInitiales.map(valeur => valeur === null ? null : valeur * signe);
    colonne.unite = colonne.uniteInitiale;
    colonne.label = colonne.labelInitial;
    delete colonne.coeff;
  }
  const selection = new Set(Array.from($("variables").selectedOptions, option => Number(option.value)));
  remplirVariables(selection);
  if(selection.size) tracer();
  correctionAppliquee = false;
  $("appliquerCorrection").disabled = !donneesOffset;
  remplirFamillesPinces();
  $("reinitialiserCorrection").hidden = true;
  $("etatCorrection").textContent = "Correction réinitialisée ; les valeurs d'origine sont restaurées.";
}

function remplirVariables(selectionExistante = new Set(), selectionParDefaut = true){
  const choix = $("variables");
  choix.replaceChildren();
  for(const colonne of mesures){
    const option = document.createElement("option");
    option.value = colonne.index;
    option.textContent = `${colonne.label}${colonne.unite && colonne.unite !== "?" ? ` [${colonne.unite}]` : ""}`;
    option.title = colonne.description || colonne.label;
    option.selected = selectionExistante.has(colonne.index) || (selectionParDefaut && !selectionExistante.size && /^(VITESSE_BANC|EFFORT_VEH)/.test(colonne.label));
    choix.appendChild(option);
  }
  if(selectionParDefaut && !choix.selectedOptions.length && choix.options.length) choix.options[0].selected = true;
}

function famillesPinces(){
  const familles = new Map();
  const suffixeGamme = /^(I_.+)_([+-]?(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?)$/;
  for(const colonne of mesures){
    if(colonne.type === "pince-fusion") continue;
    const correspondance = suffixeGamme.exec(colonne.nom);
    if(!correspondance) continue;
    if(!familles.has(correspondance[1])) familles.set(correspondance[1], []);
    familles.get(correspondance[1]).push(colonne);
  }
  return familles;
}

function remplirFamillesPinces(){
  const choix = $("famillePinces");
  const familles = famillesPinces();
  choix.replaceChildren();
  for(const racine of familles.keys()){
    const option = document.createElement("option");
    option.value = racine;
    option.textContent = racine;
    choix.appendChild(option);
  }
  $("fusionnerPinces").disabled = !correctionAppliquee || !choix.value;
  $("etatPinces").textContent = familles.size
    ? `${familles.size} famille(s) détectée(s). Appliquer l'échelle avant de fusionner.`
    : "Aucune voie de pince avec une gamme numérique détectée.";
}

function fusionnerFamillePinces(){
  const racine = $("famillePinces").value;
  if(!correctionAppliquee || !racine) return;

  const famille = famillesPinces().get(racine) || [];
  const pincesActives = famille
    .filter(colonne => {
      const valeurs = colonne.valeurs.map(valeur => valeur ?? 0);
      if(valeurs.length < 2) return false;
      const moyenne = valeurs.reduce((somme, valeur) => somme + valeur, 0) / valeurs.length;
      const variance = valeurs.reduce((somme, valeur) => somme + (valeur - moyenne) ** 2, 0) / (valeurs.length - 1);
      return Math.sqrt(variance) > 0.25;
    })
    .sort((a, b) => a.coeff - b.coeff);

  if(!pincesActives.length){
    $("etatPinces").textContent = "Aucune pince de cette famille ne présente de variation suffisante.";
    return;
  }

  const valeursFusionnees = pincesActives[0].valeurs.slice();
  for(let index = 1; index < pincesActives.length; index++){
    const pince = pincesActives[index];
    const seuil = pincesActives[index - 1].coeff - 10;
    for(let instant = 0; instant < valeursFusionnees.length; instant++){
      const valeur = pince.valeurs[instant];
      if(valeur !== null && Math.abs(valeur) > seuil) valeursFusionnees[instant] = valeur;
    }
  }

  let voieFusionnee = mesures.find(colonne => colonne.type === "pince-fusion" && colonne.famille === racine);
  if(!voieFusionnee){
    const prochainIndex = Math.max(...mesures.map(colonne => colonne.index)) + 1;
    voieFusionnee = {
      index: prochainIndex,
      nom: racine,
      nomAffiche: `${racine} (fusion des calibres)`,
      label: `${racine} (fusion des calibres)`,
      unite: "A",
      valeurs: [],
      type: "pince-fusion",
      derivee: true,
      famille: racine
    };
    mesures.push(voieFusionnee);
  }
  voieFusionnee.valeurs = valeursFusionnees;
  const selection = new Set(Array.from($("variables").selectedOptions, option => Number(option.value)));
  selection.add(voieFusionnee.index);
  remplirVariables(selection);
  tracer();
  $("etatPinces").textContent = `${racine} fusionnée à partir de ${pincesActives.length} voie(s) active(s).`;
}

function colonnesSelectionnees(){
  const indices = new Set(Array.from($("variables").selectedOptions, option => Number(option.value)));
  return mesures.filter(colonne => indices.has(colonne.index));
}

function inverserSigneSelection(){
  const colonnes = colonnesSelectionnees();
  if(!colonnes.length){
    $("etat").textContent = "Sélectionner au moins une variable à inverser.";
    return;
  }
  for(const colonne of colonnes){
    colonne.signe = (colonne.signe || 1) * -1;
    colonne.valeurs = colonne.valeurs.map(valeur => valeur === null ? null : -valeur);
  }
  tracer();
  $("etat").textContent = `Signe inversé pour ${colonnes.length} voie(s).`;
}

function renommerVoieSelectionnee(){
  const colonnes = colonnesSelectionnees();
  if(colonnes.length !== 1){
    $("etat").textContent = "Sélectionner une seule voie à renommer.";
    return;
  }

  const colonne = colonnes[0];
  const nouveauNom = window.prompt("Nouveau nom de voie :", colonne.nomAffiche || colonne.label);
  if(nouveauNom === null) return;
  const nomNettoye = nouveauNom.trim();
  if(!nomNettoye){
    $("etat").textContent = "Le nom de la voie ne peut pas être vide.";
    return;
  }

  colonne.nomAffiche = nomNettoye;
  colonne.label = nomNettoye;
  colonne.labelInitial = `${nomNettoye} (${colonne.index + 1})`;
  remplirVariables(new Set([colonne.index]));
  tracer();
  $("etat").textContent = `Voie renommée : ${nomNettoye}.`;
}

function supprimerVoieSelectionnee(){
  const colonnes = colonnesSelectionnees();
  if(colonnes.length !== 1){
    $("etat").textContent = "Sélectionner une seule voie à supprimer.";
    return;
  }

  const colonne = colonnes[0];
  if(!window.confirm("Es-tu sûr de vouloir supprimer cette voie ?")) return;

  mesures = mesures.filter(voie => voie.index !== colonne.index);
  remplirVariables(new Set(), false);
  remplirFamillesPinces();
  tracer();
  $("etat").textContent = `Voie supprimée : ${colonne.label}.`;
}

function calculerVoieSelectionnee(operation){
  const colonnes = colonnesSelectionnees();
  if(!colonnes.length){
    $("etat").textContent = "Sélectionner au moins une variable pour le calcul.";
    return;
  }

  const suffixe = operation === "moyenne" ? "moy" : "sum";
  const type = `derivee-${suffixe}`;
  const indicesSources = colonnes.map(colonne => colonne.index).sort((a, b) => a - b);
  const cleSources = indicesSources.join(",");
  const nomsSources = colonnes.map(colonne => colonne.nomAffiche || colonne.nom);
  const nomBase = colonnes.length === 1 ? nomsSources[0] : `${nomsSources[0]}_${colonnes.length}voies`;
  const longueurBaseMax = 47 - suffixe.length;
  const nom = `${nomBase.length > longueurBaseMax ? `${nomBase.slice(0, longueurBaseMax - 3)}...` : nomBase}_${suffixe}`;
  const description = `${operation === "moyenne" ? "Moyenne" : "Somme"} des voies : ${nomsSources.join(", ")}`;
  const valeurs = dates.map((date, instant) => {
    const valides = colonnes
      .map(colonne => colonne.valeurs[instant])
      .filter(Number.isFinite);
    if(!valides.length) return null;
    const somme = valides.reduce((total, valeur) => total + valeur, 0);
    return operation === "moyenne" ? somme / valides.length : somme;
  });

  let voieCalculee = mesures.find(colonne => colonne.derivee
    && colonne.type === type
    && colonne.indicesSources.join(",") === cleSources);
  if(!voieCalculee){
    voieCalculee = {
      index: Math.max(...mesures.map(colonne => colonne.index)) + 1,
      nom,
      nomAffiche: nom,
      label: nom,
      description,
      unite: colonnes.every(colonne => colonne.unite === colonnes[0].unite) ? colonnes[0].unite : "",
      valeurs: [],
      type,
      derivee: true,
      indicesSources
    };
    mesures.push(voieCalculee);
  }
  voieCalculee.valeurs = valeurs;
  voieCalculee.description = description;

  const selection = new Set(Array.from($("variables").selectedOptions, option => Number(option.value)));
  selection.add(voieCalculee.index);
  remplirVariables(selection);
  tracer();
  $("etat").textContent = `${nom} ajouté aux variables à afficher.`;
}

function ouvrirCorrectionManuelle(){
  const colonnes = colonnesSelectionnees();
  if(colonnes.length !== 1){
    $("etat").textContent = "Sélectionner une seule voie pour appliquer une correction unitaire.";
    return;
  }

  const source = colonnes[0];
  const voieModifiee = mesures.find(colonne => colonne.type === "derivee-correction-manuelle" && colonne.sourceIndex === source.index);
  $("voieCorrectionManuelle").textContent = `Signal sélectionné : ${source.nomAffiche || source.nom || source.label}`;
  $("offsetManuel").value = voieModifiee ? String(voieModifiee.offsetManuel) : "0";
  $("gainManuel").value = voieModifiee ? String(voieModifiee.gainManuel) : "1";
  $("erreurCorrectionManuelle").textContent = "";
  $("correctionManuelleDialog").showModal();
}

function appliquerCorrectionManuelle(evenement){
  evenement.preventDefault();
  const colonnes = colonnesSelectionnees();
  if(colonnes.length !== 1){
    $("erreurCorrectionManuelle").textContent = "Sélectionner une seule voie à corriger.";
    return;
  }

  const offset = $("offsetManuel").valueAsNumber;
  const gain = $("gainManuel").valueAsNumber;
  if(!Number.isFinite(offset) || !Number.isFinite(gain)){
    $("erreurCorrectionManuelle").textContent = "Saisir un offset et un gain numériques.";
    return;
  }

  const source = colonnes[0];
  const nomSource = source.nomAffiche || source.nom || source.label;
  const nom = `${nomSource}_mod`;
  const valeurs = source.valeurs.map(valeur => Number.isFinite(valeur) ? (valeur - offset) * gain : null);
  let voieModifiee = mesures.find(colonne => colonne.type === "derivee-correction-manuelle" && colonne.sourceIndex === source.index);
  if(!voieModifiee){
    voieModifiee = {
      index: Math.max(...mesures.map(colonne => colonne.index)) + 1,
      nom,
      nomAffiche: nom,
      label: nom,
      unite: source.unite,
      valeurs: [],
      type: "derivee-correction-manuelle",
      derivee: true,
      sourceIndex: source.index
    };
    mesures.push(voieModifiee);
  }
  Object.assign(voieModifiee, {
    nom,
    nomAffiche: nom,
    label: nom,
    description: `Correction unitaire de ${nomSource} : (valeur - ${offset}) x ${gain}.`,
    unite: source.unite,
    valeurs,
    offsetManuel: offset,
    gainManuel: gain
  });

  const selection = new Set(Array.from($("variables").selectedOptions, option => Number(option.value)));
  selection.add(voieModifiee.index);
  remplirVariables(selection);
  $("correctionManuelleDialog").close();
  tracer();
  $("etat").textContent = `${nom} créé avec la correction (valeur - ${offset}) x ${gain}.`;
}

function creerPhaseEssai(){
  const vitesseBanc = mesures.find(colonne => colonne.nomAffiche === "VITESSE_BANC");
  const vitesseCycle = mesures.find(colonne => colonne.nomAffiche === "VITESSE_CYCLE");
  if(!vitesseBanc || !vitesseCycle){
    $("etat").textContent = "Les voies VITESSE_BANC et VITESSE_CYCLE sont nécessaires pour créer PHASE_ESSAI.";
    return;
  }

  const nombrePoints = dates.length;
  const vitesse = vitesseBanc.valeurs.map(valeur => Number.isFinite(valeur) ? valeur : 0);
  const seuilVitesseNulle = 0.05; // km/h
  const cycle = vitesseCycle.valeurs.map((valeur, index) => Math.abs(vitesse[index]) <= seuilVitesseNulle || !Number.isFinite(valeur) ? 0 : valeur);
  const frontCycle = new Array(nombrePoints).fill(0);
  for(let index = 0; index < nombrePoints - 1; index++){
    if(Math.abs(cycle[index] - cycle[index + 1]) > 0) frontCycle[index] = 1;
  }

  const phases = new Array(nombrePoints);
  let phaseCourante = 0;
  let phaseMax = 0;
  const statsInitiales = new Map();
  for(let index = 0; index < nombrePoints; index++){
    if(index < nombrePoints - 1) phaseCourante += Math.abs(frontCycle[index + 1] - frontCycle[index]);
    phases[index] = phaseCourante;
    phaseMax = Math.max(phaseMax, phaseCourante);
    let stats = statsInitiales.get(phaseCourante);
    if(!stats){
      stats = { longueur: 0, sommeVitesse: 0, minimumCycle: Infinity };
      statsInitiales.set(phaseCourante, stats);
    }
    stats.longueur++;
    stats.sommeVitesse += vitesse[index];
    stats.minimumCycle = Math.min(stats.minimumCycle, cycle[index]);
  }

  const remappage = new Map();
  const longueurMinimale = 200 / pasTemps(dates);
  for(let phase = 1; phase < phaseMax; phase++){
    const stats = statsInitiales.get(phase);
    const phaseSuivante = statsInitiales.get(phase + 1);
    if(stats && phaseSuivante && stats.longueur < longueurMinimale && phaseSuivante.minimumCycle === 0){
      remappage.set(phase, phase - 1);
    }
  }

  const phasesFusionnees = phases.map(phase => remappage.get(phase) ?? phase);
  const statsFinales = new Map();
  for(let index = 0; index < nombrePoints; index++){
    const phase = phasesFusionnees[index];
    let stats = statsFinales.get(phase);
    if(!stats){
      stats = { longueur: 0, sommeVitesse: 0 };
      statsFinales.set(phase, stats);
    }
    stats.longueur++;
    stats.sommeVitesse += vitesse[index];
  }

  const numerosPhase = new Map([[0, 0]]);
  let numeroEssai = 1;
  for(let phase = 1; phase <= phaseMax; phase++){
    const stats = statsFinales.get(phase);
    if(!stats) continue;
    numerosPhase.set(phase, stats.sommeVitesse / stats.longueur === 5 ? 0 : numeroEssai);
    if(stats.sommeVitesse / stats.longueur !== 5 && stats.longueur >= 500) numeroEssai++;
  }
  const valeurs = phasesFusionnees.map(phase => numerosPhase.get(phase) ?? 0);
  let voiePhase = mesures.find(colonne => colonne.nomAffiche === "PHASE_ESSAI");
  if(!voiePhase){
    voiePhase = {
      index: Math.max(...mesures.map(colonne => colonne.index)) + 1,
      nom: "PHASE_ESSAI",
      nomAffiche: "PHASE_ESSAI",
      label: "PHASE_ESSAI",
      unite: "",
      valeurs: [],
      valides: 0
    };
    mesures.push(voiePhase);
  }
  Object.assign(voiePhase, {
    nom: "PHASE_ESSAI",
    nomAffiche: "PHASE_ESSAI",
    label: "PHASE_ESSAI",
    description: "Phases d'essai calculées depuis VITESSE_CYCLE et VITESSE_BANC.",
    unite: "",
    valeurs,
    valides: valeurs.length,
    type: "derivee-phase-essai",
    derivee: true,
    indicesSources: [vitesseBanc.index, vitesseCycle.index]
  });

  const selection = new Set(Array.from($("variables").selectedOptions, option => Number(option.value)));
  selection.add(voiePhase.index);
  remplirVariables(selection);
  tracer();
  const phasesNumerotees = new Set(valeurs.filter(valeur => valeur > 0)).size;
  $("etat").textContent = `Voie PHASE_ESSAI créée : ${phasesNumerotees} phase(s) numérotée(s).`;
}

/* ---- sélection d'une plage temporelle ---- */

let grapheEcoute = false;

function secondesDepuisDebut(instant){
  return (Date.parse(instant) - Date.parse(dates[0])) / 1000;
}

function indicesPlage(){
  const pas = pasTemps(dates);
  const dernier = dates.length - 1;
  const borne = valeur => Math.min(dernier, Math.max(0, Math.round(valeur / pas)));
  const debut = borne($("plageDebut").valueAsNumber);
  const fin = borne($("plageFin").valueAsNumber);
  return debut <= fin ? { debut, fin } : { debut: fin, fin: debut };
}

function majEtatPlage(){
  const { debut, fin } = indicesPlage();
  $("etatPlage").textContent = `${(fin - debut + 1).toLocaleString("fr-FR")} échantillons sélectionnés sur ${dates.length.toLocaleString("fr-FR")}.`;
}

function reinitialiserPlage(){
  if(!dates.length) return;
  $("plageDebut").value = "0";
  $("plageFin").value = formaterValeurSeed(secondesDepuisDebut(dates[dates.length - 1]));
  majEtatPlage();
}

function ecrirePlageDepuisGraphe(evenement){
  const debut = evenement["xaxis.range[0]"] ?? evenement["xaxis.range"]?.[0];
  const fin = evenement["xaxis.range[1]"] ?? evenement["xaxis.range"]?.[1];
  if(evenement["xaxis.autorange"] || debut === undefined || fin === undefined){
    if(evenement["xaxis.autorange"]) reinitialiserPlage();
    return;
  }
  const dernier = secondesDepuisDebut(dates[dates.length - 1]);
  $("plageDebut").value = formaterValeurSeed(Math.max(0, secondesDepuisDebut(debut)));
  $("plageFin").value = formaterValeurSeed(Math.min(dernier, secondesDepuisDebut(fin)));
  majEtatPlage();
}

function appliquerPlageAuGraphe(){
  if(typeof Plotly === "undefined" || !dates.length) return;
  const { debut, fin } = indicesPlage();
  majEtatPlage();
  Plotly.relayout("monGraphe", { "xaxis.range": [dates[debut], dates[fin]] });
}

function tracer(){
  if(typeof Plotly === "undefined"){
    $("etat").textContent = "Plotly indisponible : vérifier la connexion réseau.";
    return;
  }
  const selection = Array.from($("variables").selectedOptions, option => Number(option.value));
  if(!selection.length){
    $("graphCard").hidden = true;
    Plotly.purge("monGraphe");
    grapheEcoute = false;
    $("etat").textContent = "Sélectionner au moins une variable à tracer.";
    return;
  }
  if(selection.length > 16){
    $("etat").textContent = "Choisir au plus 16 variables pour garder un graphique réactif.";
    return;
  }
  const colonnes = selection.map(index => mesures.find(item => item.index === index));
  const unites = [...new Set(colonnes.map(colonne => colonne.unite || "Valeur"))];
  const deuxAxes = unites.length === 2;
  const traces = colonnes.map(colonne => ({
      x: dates,
      y: colonne.valeurs,
      name: `${colonne.label}${colonne.unite && colonne.unite !== "?" ? ` (${colonne.unite})` : ""}`,
      type: "scattergl",
      mode: "lines",
      connectgaps: false,
      yaxis: deuxAxes && colonne.unite === unites[1] ? "y2" : "y",
      hovertemplate: "%{x}<br>%{y}<extra>%{fullData.name}</extra>"
  }));
  $("graphCard").hidden = false;
  Plotly.react("monGraphe", traces, {
    autosize: true,
    paper_bgcolor: "#FFFFFF",
    plot_bgcolor: "#FFFFFF",
    colorway: ["#000000", "#EFDF00", "#888B8D", "#0057B8", "#C8102E", "#BBBCBC", "#00843D", "#7A3E9D"],
    font: { color: "#000000", family: "NouvelR, Segoe UI, Roboto, Arial, sans-serif" },
    margin: { t: 20, r: deuxAxes ? 60 : 25, b: 60, l: 60 },
    xaxis: { title: "Date / heure", type: "date", gridcolor: "#D9D9D6", zerolinecolor: "#BBBCBC", rangeslider: { thickness: .08, bgcolor: "#FAFAF9", bordercolor: "#D9D9D6", borderwidth: 1 } },
    yaxis: { title: unites.length === 1 ? unites[0] : deuxAxes ? unites[0] : "Valeur", gridcolor: "#D9D9D6", zerolinecolor: "#BBBCBC" },
    ...(deuxAxes ? { yaxis2: { title: unites[1], overlaying: "y", side: "right", showgrid: false } } : {}),
    legend: { orientation: "h", y: -0.3 },
    hovermode: "x unified"
  }, { responsive: true, displaylogo: false });
  if(!grapheEcoute){
    $("monGraphe").on("plotly_relayout", ecrirePlageDepuisGraphe);
    grapheEcoute = true;
  }
}

function exporterSeed(debut, fin, suffixe){
  if(!dates.length || !mesures.length) return;
  const nomSource = $("nomFichierMesure").textContent.replace(/\.[^.]+$/, "").replace(/^SEED_/, "");
  const nomFichier = `SEED_${nomSource}${donneesAvantSync ? "_synchronise" : ""}${suffixe}.seed`;
  const contenu = contenuExportSeed(mesures, dates, debut, fin);
  const url = URL.createObjectURL(new Blob([encoderCp1252(contenu)], { type: "text/tab-separated-values;charset=windows-1252" }));
  const lien = document.createElement("a");
  lien.href = url;
  lien.download = nomFichier;
  lien.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  $("etat").textContent = `${nomFichier} exporté : ${(fin - debut + 1).toLocaleString("fr-FR")} mesures, ${mesures.length} variables.`;
}

$("exporterPlage").addEventListener("click", () => {

];

async function chargerSourceExterne(evenement, type){
  const fichier = evenement.target.files[0];
  if(!fichier) return;
  const session = chargement;
  $("ouvrirSync").disabled = true;
  $("etatSync").textContent = `Lecture de ${fichier.name}...`;
  try{
    const resultat = type ? await analyserSourceTemporelle(fichier, type, pasTemps(dates)) : await analyserCsv(fichier);
    if(session !== chargement || evenement.target.files[0] !== fichier) return;
    sourceExterne = resultat;
    $("fichierOffsetSource").value = "";
    $("appliquerEchelleSource").textContent = resultat.libelle === "CAN" ? "Appliquer offset et échelle CAN" : "Mettre à l'échelle";
    for(const [identifiant] of ENTREES_SOURCES) if(identifiant !== evenement.target.id) $(identifiant).value = "";
    $("ouvrirSync").disabled = false;
    $("appliquerEchelleSource").disabled = !resultat.mesures.some(colonne => echelleVoie(colonne.nom));
    const pas = resultat.reechantillonne
      ? ` Pas de temps ${resultat.pasSource.toFixed(4)} s rééchantillonné à ${resultat.pasCible.toFixed(4)} s.`
      : resultat.pasSource ? ` Pas de temps ${resultat.pasSource.toFixed(4)} s identique au fichier M00x.` : "";
    $("etatSync").textContent = `${fichier.name} : ${resultat.longueur.toLocaleString("fr-FR")} échantillons, ${resultat.mesures.length} voies numériques.${pas} Choisir les voies de synchronisation.`;
  }catch(erreur){
    if(session !== chargement || evenement.target.files[0] !== fichier) return;
    sourceExterne = null;
    $("appliquerEchelleSource").disabled = true;
    $("etatSync").textContent = `Erreur : ${erreur.message}`;
  }
}

for(const [identifiant, type] of ENTREES_SOURCES){
  $(identifiant).addEventListener("change", evenement => chargerSourceExterne(evenement, type));
}
